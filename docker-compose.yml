# Postgres on a local volume + the app (API + React frontend) in one container.
# Served at https://rank.reactiveweb.dev through the VPS's Traefik (network edge-traefik),
# same setup as reactiveweb.dev. Traefik gets the HTTPS certificate automatically.
#
#   docker compose up -d --build      # start everything
#   docker compose up -d db           # only the database (for `npm run dev` on your machine)
#
# Secrets come from ./.env (see .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rank
      POSTGRES_USER: rank
      # Optional. Postgres is only reachable from this machine, so the default is fine.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rank}
    volumes:
      # All data lives here; survives restarts, rebuilds and `docker compose down`
      # (only `docker compose down -v` deletes it). Tables are created by the app on first start.
      - pgdata:/var/lib/postgresql/data
    ports:
      # Localhost only, never exposed to the internet
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rank -d rank"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rank:${POSTGRES_PASSWORD:-rank}@db:5432/rank
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Demo mode: logging in with a new username + password 123456 creates a student account.
      # Turn off for real use: DEMO_SIGNUP=false in .env
      DEMO_SIGNUP: ${DEMO_SIGNUP:-true}
      PORT: 3000
    # No host port: Traefik reaches the app over the edge-traefik network.
    networks:
      - default      # to reach the database
      - edge-traefik # to be reached by Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-traefik"
      - "traefik.http.middlewares.rank-compress.compress=true"
      - "traefik.http.middlewares.rank-compress.compress.encodings=br,zstd,gzip"
      - "traefik.http.middlewares.rank-secheaders.headers.customResponseHeaders.Server="
      # HTTPS only for a year (the app itself already sets nosniff, frame DENY and referrer policy)
      - "traefik.http.middlewares.rank-secheaders.headers.stsSeconds=31536000"
      - "traefik.http.routers.rank-web.rule=Host(`rank.reactiveweb.dev`)"
      - "traefik.http.routers.rank-web.entrypoints=websecure"
      - "traefik.http.routers.rank-web.tls.certresolver=le"
      - "traefik.http.routers.rank-web.middlewares=rank-compress@docker,rank-secheaders@docker"
      - "traefik.http.services.rank-web.loadbalancer.server.port=3000"

volumes:
  pgdata:

networks:
  edge-traefik:
    external: true
