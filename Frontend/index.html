<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rating System - Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- Background: geometric star constellation -->
  <div class="bg" aria-hidden="true">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <rect width="1920" height="1080" fill="#0D1B24"/>

      <!-- 3 large stars, cropped at the edges -->
      <g fill="#00BABC" fill-opacity="0.06" stroke="#00BABC" stroke-opacity="0.10" stroke-width="1.5">
        <polygon points="176,787 199,943 349,994 208,1065 206,1223 95,1110 -56,1158 17,1017 -75,888 81,914"/>
        <polygon points="1771,-61 1856,39 1984,8 1916,120 1984,232 1856,201 1771,301 1761,170 1640,120 1761,70"/>
        <polygon points="1897,741 1918,821 1998,839 1929,884 1936,966 1872,913 1797,946 1827,869 1772,807 1855,812"/>
      </g>

      <!-- Small, spread-out stars (some filled) -->
      <g stroke="#00BABC" stroke-opacity="0.10" stroke-width="1" fill="none">
        <polygon fill="#00BABC" fill-opacity="0.08" points="303,134 305,145 316,148 306,154 307,165 299,157 288,161 293,151 286,142 297,143"/>
        <polygon points="559,80 562,86 569,86 564,91 567,97 561,94 555,99 556,92 550,88 557,87"/>
        <polygon points="1343,58 1344,67 1352,69 1345,73 1344,81 1339,75 1331,78 1335,70 1330,63 1338,65"/>
        <polygon points="128,457 133,465 141,464 136,471 139,479 131,476 124,482 125,473 117,468 126,466"/>
        <polygon fill="#00BABC" fill-opacity="0.08" points="426,623 427,635 438,641 426,645 425,657 417,648 405,650 412,640 406,629 418,632"/>
        <polygon fill="#00BABC" fill-opacity="0.08" points="1576,465 1583,474 1593,472 1587,480 1591,490 1582,487 1574,494 1574,484 1565,479 1575,476"/>
        <polygon points="1502,810 1503,817 1510,818 1504,822 1505,829 1499,824 1493,827 1496,821 1491,815 1498,816"/>
        <polygon points="901,111 903,117 909,118 904,122 904,128 900,124 894,127 896,121 892,116 898,116"/>
        <polygon points="1028,979 1032,985 1040,984 1035,991 1038,997 1031,995 1026,1000 1026,992 1019,989 1026,987"/>
      </g>
    </svg>
  </div>

  <main class="login">
    <header class="login-header">
      <!-- 3 stars that fill one after another on load -->
      <div id="stars" class="stars" aria-hidden="true">
        <svg class="star star-sm" viewBox="0 0 24 24"><path class="star-path s1" d="M12 2.5L14.9 8.6L21.6 9.5L16.7 14.2L17.9 20.9L12 17.7L6.1 20.9L7.3 14.2L2.4 9.5L9.1 8.6L12 2.5Z"/></svg>
        <svg class="star star-lg" viewBox="0 0 24 24"><path class="star-path s2" d="M12 2.5L14.9 8.6L21.6 9.5L16.7 14.2L17.9 20.9L12 17.7L6.1 20.9L7.3 14.2L2.4 9.5L9.1 8.6L12 2.5Z"/></svg>
        <svg class="star star-sm" viewBox="0 0 24 24"><path class="star-path s3" d="M12 2.5L14.9 8.6L21.6 9.5L16.7 14.2L17.9 20.9L12 17.7L6.1 20.9L7.3 14.2L2.4 9.5L9.1 8.6L12 2.5Z"/></svg>
      </div>
      <h1>Rating System</h1>
      <p class="subtitle">Sign in with your 42 intra</p>
    </header>

    <form id="login-form" class="login-form" novalidate>
      <label class="sr-only" for="intra-login">Intra name</label>
      <input id="intra-login" class="field" type="text" name="login" placeholder="Intra name"
             autocomplete="username" autocapitalize="none" spellcheck="false" required>

      <div class="password-wrap">
        <label class="sr-only" for="intra-password">Password</label>
        <input id="intra-password" class="field field-password" type="password" name="password"
               placeholder="Password" autocomplete="current-password" required>
        <button id="toggle-visibility" class="eye" type="button" aria-label="Show password" aria-pressed="false">
          <!-- eye -->
          <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <!-- eye crossed -->
          <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7c1.9 0 3.6-.6 5-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>

      <!-- Error message (hidden until needed) -->
      <div id="error-box" class="error hidden" role="alert" aria-live="assertive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>
        <span id="error-text">Wrong intra name or password</span>
      </div>

      <button id="signin-btn" class="btn" type="submit">Sign in</button>

      <div id="success-box" class="success hidden" role="status" aria-live="polite"></div>

    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
